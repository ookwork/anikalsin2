name: Build for cPanel deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build (webpack, matches cPanel target)
        run: npm run build:webpack

      - name: Copy static/public assets into standalone bundle
        run: node scripts/copy-standalone-assets.js

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 14
