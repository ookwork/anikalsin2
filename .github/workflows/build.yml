name: Build for cPanel deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: "file:./build-temp.db"
      SESSION_SECRET: "build-time-placeholder-not-used-in-production-32chars"
      NEXT_PUBLIC_SITE_URL: "https://anikalsin.com.tr"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 against an old glibc (for old CentOS/CloudLinux hosts)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work debian:10 bash -c "
            sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g' /etc/apt/sources.list &&
            echo 'Acquire::Check-Valid-Until \"false\";' > /etc/apt/apt.conf.d/99no-check-valid &&
            apt-get update && apt-get install -y curl python3 make g++ ca-certificates &&
            curl -fsSL https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz -o /tmp/node.tar.xz &&
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1 &&
            sed -i 's/c++20/c++2a/g' node_modules/better-sqlite3/binding.gyp &&
            npm rebuild better-sqlite3 --build-from-source
          "

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create build-time database schema
        run: npx prisma migrate deploy

      - name: Build (webpack, matches cPanel target)
        run: npm run build:webpack

      - name: Copy static/public assets into standalone bundle
        run: node scripts/copy-standalone-assets.js

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 14
          include-hidden-files: true
